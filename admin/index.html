<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DADY CLOTHES Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}
button{border:0;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
textarea{min-height:80px}

.login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{background:white;width:100%;max-width:400px;padding:30px;border-radius:15px;box-shadow:0 5px 25px #0002}
.login-box h1{text-align:center}
.login-btn{width:100%;background:#111;color:white;margin-top:10px}
.error{color:#d00000;text-align:center}

#panel{display:none}

header{background:#111;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{margin:0}

.container{max-width:1100px;margin:25px auto;padding:0 15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
.card h3{margin:0 0 8px}
.card b{font-size:28px}

.section{background:white;padding:20px;margin-top:20px;border-radius:12px}

.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.product{border:1px solid #eee;border-radius:10px;overflow:hidden}
.product img{width:100%;height:220px;object-fit:cover}
.product div{padding:12px}
.product h3{margin:5px 0}
.price{font-weight:bold;font-size:18px}

.add{background:#111;color:white}
.edit{background:#e8e8e8;margin-right:5px}
.delete{background:#ffdddd;color:#b00000}
.logout{background:#ff4444;color:white}

#editBox{display:none;border:2px solid #111;padding:15px;border-radius:10px;margin-bottom:20px}

.order{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:10px}

@media(max-width:700px){
.cards{grid-template-columns:1fr}
header{align-items:flex-start}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
<div class="login-box">

<h1>🛍️ DADY CLOTHES</h1>
<p style="text-align:center">Admin Login</p>

<input id="adminEmail" type="email" placeholder="Admin Email">
<input id="adminPass" type="password" placeholder="Password">

<button class="login-btn" onclick="login()">LOGIN</button>

<p id="loginError" class="error"></p>

</div>
</div>


<!-- ADMIN PANEL -->
<div id="panel">

<header>
<h2>DADY CLOTHES</h2>

<div>
<button onclick="location.href='../'">VIEW STORE</button>
<button class="logout" onclick="logout()">LOGOUT</button>
</div>
</header>


<div class="container">

<h1>Admin Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<b id="totalProducts">0</b>
</div>

<div class="card">
<h3>Total Orders</h3>
<b id="totalOrders">0</b>
</div>

<div class="card">
<h3>Store Status</h3>
<b style="font-size:20px">🟢 Online</b>
</div>

</div>


<!-- ADD PRODUCT -->
<div class="section">

<h2>➕ Add Product</h2>

<input id="name" placeholder="Product name">

<select id="category">
<option>T-Shirts</option>
<option>Hoodies</option>
<option>Jeans</option>
<option>Pants</option>
<option>Shirts</option>
<option>Jackets</option>
</select>

<input id="price" type="number" placeholder="Selling price ₹">
<input id="oldPrice" type="number" placeholder="Old price ₹">
<input id="image" placeholder="Product image URL">

<textarea id="description" placeholder="Product description"></textarea>

<button class="add" onclick="addProduct()">ADD PRODUCT</button>

</div>


<!-- EDIT -->
<div id="editBox">

<h2>✏️ Edit Product</h2>

<input id="editName" placeholder="Product name">

<select id="editCategory">
<option>T-Shirts</option>
<option>Hoodies</option>
<option>Jeans</option>
<option>Pants</option>
<option>Shirts</option>
<option>Jackets</option>
</select>

<input id="editPrice" type="number" placeholder="Selling price ₹">
<input id="editOldPrice" type="number" placeholder="Old price ₹">
<input id="editImage" placeholder="Product image URL">

<textarea id="editDescription" placeholder="Description"></textarea>

<button class="add" onclick="saveEdit()">SAVE CHANGES</button>
<button onclick="cancelEdit()">CANCEL</button>

</div>


<!-- PRODUCTS -->
<div class="section">

<h2>📦 Products</h2>

<div id="products" class="products"></div>

</div>


<!-- ORDERS -->
<div class="section">

<h2>🧾 Orders</h2>

<div id="orders">
<p>No orders yet.</p>
</div>

</div>

</div>
</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE CONNECTION
   ================================ */

const SUPABASE_URL = https://kykdfhmumkttibcdcigg.supabase.co

const SUPABASE_PUBLISHABLE_KEY = sb_publishable_aQGIGobtka8ZK_SZWx6z9A_C6XTHegW

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* ================================
   VARIABLES
   ================================ */

let products = [];
let editId = null;


/* ================================
   LOGIN
   ================================ */

async function login(){

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPass").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.textContent = "";

  if(!email || !password){

    errorBox.textContent =
      "Email aur password bharo.";

    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    errorBox.textContent =
      "Login failed: " + error.message;

    return;
  }

  await checkAdmin();

}


/* ================================
   CHECK ADMIN
   ================================ */

async function checkAdmin(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){

    showLogin();

    return;
  }

  const {data,error} =
    await db
      .from("admins")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();

  if(error || !data){

    await db.auth.signOut();

    document.getElementById("loginError").textContent =
      "Is account ko admin permission nahi hai.";

    showLogin();

    return;
  }

  showPanel();

}


/* ================================
   SHOW PANEL
   ================================ */

function showPanel(){

  document.getElementById("login").style.display="none";

  document.getElementById("panel").style.display="block";

  loadProducts();

  loadOrders();

}


/* ================================
   SHOW LOGIN
   ================================ */

function showLogin(){

  document.getElementById("login").style.display="flex";

  document.getElementById("panel").style.display="none";

}


/* ================================
   LOGOUT
   ================================ */

async function logout(){

  await db.auth.signOut();

  showLogin();

}


/* ================================
   LOAD PRODUCTS
   ================================ */

async function loadProducts(){

  const {data,error} =
    await db
      .from("products")
      .select("*")
      .order("id",{ascending:true});

  if(error){

    alert("Products load error: " + error.message);

    return;
  }

  products = data || [];

  renderProducts();

}


/* ================================
   RENDER PRODUCTS
   ================================ */

function renderProducts(){

  document.getElementById("totalProducts").textContent =
    products.length;

  const box =
    document.getElementById("products");

  if(products.length === 0){

    box.innerHTML =
      "<p>No products yet.</p>";

    return;
  }

  box.innerHTML =
    products.map(p => `

      <div class="product">

        <img
          src="${escapeHTML(p.image || '')}"
          alt="${escapeHTML(p.name || '')}"
        >

        <div>

          <small>${escapeHTML(p.category || '')}</small>

          <h3>${escapeHTML(p.name || '')}</h3>

          <p class="price">
            ₹${p.price}
            <del>₹${p.old_price || p.price}</del>
          </p>

          <p>
            ${escapeHTML(p.description || '')}
          </p>

          <button
            class="edit"
            onclick="editProduct(${p.id})">
            ✏️ EDIT
          </button>

          <button
            class="delete"
            onclick="deleteProduct(${p.id})">
            🗑️ DELETE
          </button>

        </div>

      </div>

    `).join("");

}


/* ================================
   ADD PRODUCT
   ================================ */

async function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    Number(document.getElementById("price").value);

  const oldPrice =
    Number(document.getElementById("oldPrice").value);

  const image =
    document.getElementById("image").value.trim();

  const description =
    document.getElementById("description").value.trim();


  if(!name || !price){

    alert("Product name aur price bharo.");

    return;
  }


  const {error} =
    await db
      .from("products")
      .insert({

        name:name,

        category:category,

        price:price,

        old_price:oldPrice || price,

        image:image ||
        "https://via.placeholder.com/600x700?text=DADY+CLOTHES",

        description:
        description ||
        "Premium quality product."

      });


  if(error){

    alert("Product add nahi hua: " + error.message);

    return;
  }


  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("oldPrice").value="";
  document.getElementById("image").value="";
  document.getElementById("description").value="";


  await loadProducts();

  alert("Product added successfully 🎉");

}


/* ================================
   EDIT PRODUCT
   ================================ */

function editProduct(id){

  const p =
    products.find(x => Number(x.id) === Number(id));

  if(!p)return;

  editId = id;

  document.getElementById("editBox").style.display =
    "block";

  document.getElementById("editName").value =
    p.name || "";

  document.getElementById("editCategory").value =
    p.category || "T-Shirts";

  document.getElementById("editPrice").value =
    p.price || "";

  document.getElementById("editOldPrice").value =
    p.old_price || "";

  document.getElementById("editImage").value =
    p.image || "";

  document.getElementById("editDescription").value =
    p.description || "";

  document.getElementById("editBox").scrollIntoView({
    behavior:"smooth"
  });

}


/* ================================
   SAVE EDIT
   ================================ */

async function saveEdit(){

  const name =
    document.getElementById("editName").value.trim();

  const category =
    document.getElementById("editCategory").value;

  const price =
    Number(document.getElementById("editPrice").value);

  const oldPrice =
    Number(document.getElementById("editOldPrice").value);

  const image =
    document.getElementById("editImage").value.trim();

  const description =
    document.getElementById("editDescription").value.trim();


  if(!name || !price){

    alert("Name aur price required hai.");

    return;
  }


  const {error} =
    await db
      .from("products")
      .update({

        name:name,

        category:category,

        price:price,

        old_price:oldPrice || price,

        image:image,

        description:description

      })
      .eq("id",editId);


  if(error){

    alert("Update failed: " + error.message);

    return;
  }


  cancelEdit();

  await loadProducts();

  alert("Product updated successfully ✅");

}


/* ================================
   CANCEL EDIT
   ================================ */

function cancelEdit(){

  editId=null;

  document.getElementById("editBox").style.display =
    "none";

}


/* ================================
   DELETE PRODUCT
   ================================ */

async function deleteProduct(id){

  if(!confirm("Product delete karna hai?"))return;


  const {error} =
    await db
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert("Delete failed: " + error.message);

    return;
  }


  await loadProducts();

  alert("Product deleted ✅");

}


/* ================================
   LOAD ORDERS
   ================================ */

async function loadOrders(){

  const {data,error} =
    await db
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    document.getElementById("orders").innerHTML =
      "<p>Orders load error: " +
      escapeHTML(error.message) +
      "</p>";

    return;
  }


  const orders = data || [];

  document.getElementById("totalOrders").textContent =
    orders.length;


  const box =
    document.getElementById("orders");


  if(orders.length === 0){

    box.innerHTML =
      "<p>No orders yet.</p>";

    return;
  }


  box.innerHTML =
    orders.map(o => `

      <div class="order">

        <b>
          Order ID:
          ${escapeHTML(o.order_id || "")}
        </b>

        <p>
          Customer:
          ${escapeHTML(o.name || "")}
          <br>

          Phone:
          ${escapeHTML(o.phone || "")}
          <br>

          Address:
          ${escapeHTML(o.address || "")}
          <br>

          Pincode:
          ${escapeHTML(o.pin || "")}
        </p>

        <b>
          Total: ₹${o.total || 0}
        </b>

        <p>
          Status:
          ${escapeHTML(o.status || "Pending")}
        </p>

      </div>

    `).join("");

}


/* ================================
   SECURITY HELPER
   ================================ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   START
   ================================ */

document.addEventListener("DOMContentLoaded",async()=>{

  const {
    data:{session}
  } = await db.auth.getSession();

  if(session){

    await checkAdmin();

  }else{

    showLogin();

  }

});

</script>

</body>
  </html>
