<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DADY CLOTHES Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#171717
}
button{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px
}
textarea{min-height:80px}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.login-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px #0002
}
.login-box h1{text-align:center}
.login-btn{
  width:100%;
  background:#111;
  color:white;
  margin-top:10px
}
.error{
  color:#d00000;
  text-align:center
}

#panel{display:none}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}
header h2{margin:0}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px #0001
}
.card h3{margin:0 0 8px}
.card b{font-size:28px}

.section{
  background:white;
  padding:20px;
  margin-top:20px;
  border-radius:12px
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px
}
.product{
  border:1px solid #eee;
  border-radius:10px;
  overflow:hidden
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover
}
.product div{padding:12px}
.product h3{margin:5px 0}
.price{
  font-weight:bold;
  font-size:18px
}

.add{background:#111;color:white}
.edit{background:#e8e8e8;margin-right:5px}
.delete{background:#ffdddd;color:#b00000}

.logout{
  background:#ff4444;
  color:white
}

#editBox{
  display:none;
  border:2px solid #111;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px
}

@media(max-width:700px){
  .cards{grid-template-columns:1fr}
  header{align-items:flex-start}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="login-box">
    <h1>🛍️ DADY CLOTHES</h1>
    <p style="text-align:center">Admin Login</p>

    <input id="adminUser" placeholder="Username">
    <input id="adminPass" type="password" placeholder="Password">

    <button class="login-btn" onclick="login()">LOGIN</button>

    <p id="loginError" class="error"></p>
  </div>
</div>


<!-- ADMIN PANEL -->
<div id="panel">

<header>
  <h2>DADY CLOTHES</h2>

  <div>
    <button onclick="location.href='../'">VIEW STORE</button>
    <button class="logout" onclick="logout()">LOGOUT</button>
  </div>
</header>

<div class="container">

<h1>Admin Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>Total Products</h3>
    <b id="totalProducts">0</b>
  </div>

  <div class="card">
    <h3>Total Orders</h3>
    <b id="totalOrders">0</b>
  </div>

  <div class="card">
    <h3>Store Status</h3>
    <b style="font-size:20px">🟢 Online</b>
  </div>

</div>


<!-- ADD PRODUCT -->
<div class="section">

<h2>➕ Add Product</h2>

<input id="name" placeholder="Product name">

<select id="category">
  <option>T-Shirts</option>
  <option>Hoodies</option>
  <option>Jeans</option>
  <option>Pants</option>
  <option>Shirts</option>
  <option>Jackets</option>
</select>

<input id="price" type="number" placeholder="Selling price ₹">
<input id="oldPrice" type="number" placeholder="Old price ₹">
<input id="image" placeholder="Product image URL">

<textarea id="description" placeholder="Product description"></textarea>

<button class="add" onclick="addProduct()">ADD PRODUCT</button>

</div>


<!-- EDIT PRODUCT -->
<div id="editBox">

<h2>✏️ Edit Product</h2>

<input id="editName" placeholder="Product name">

<select id="editCategory">
  <option>T-Shirts</option>
  <option>Hoodies</option>
  <option>Jeans</option>
  <option>Pants</option>
  <option>Shirts</option>
  <option>Jackets</option>
</select>

<input id="editPrice" type="number" placeholder="Selling price ₹">
<input id="editOldPrice" type="number" placeholder="Old price ₹">
<input id="editImage" placeholder="Product image URL">

<textarea id="editDescription" placeholder="Description"></textarea>

<button class="add" onclick="saveEdit()">SAVE CHANGES</button>
<button onclick="cancelEdit()">CANCEL</button>

</div>


<!-- PRODUCTS -->
<div class="section">

<h2>📦 Products</h2>

<div id="products" class="products"></div>

</div>


<!-- ORDERS -->
<div class="section">

<h2>🧾 Orders</h2>

<div id="orders">
  <p>No orders yet.</p>
</div>

</div>

</div>
</div>


<script>

const USERNAME="admin";
const PASSWORD="1234";

let products=JSON.parse(
  localStorage.getItem("dady_products") || "[]"
);

let editId=null;


/* LOGIN */

function login(){

  const user=document.getElementById("adminUser").value.trim();
  const pass=document.getElementById("adminPass").value;

  if(user===USERNAME && pass===PASSWORD){

    sessionStorage.setItem("dady_admin","yes");

    showPanel();

  }else{

    document.getElementById("loginError").textContent=
      "Wrong username or password";

  }
}


function showPanel(){

  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";

  renderProducts();

  loadOrders();
}


function logout(){

  sessionStorage.removeItem("dady_admin");

  location.reload();

}


/* CHECK LOGIN */

if(sessionStorage.getItem("dady_admin")==="yes"){
  showPanel();
}


/* SAVE */

function saveProducts(){

  localStorage.setItem(
    "dady_products",
    JSON.stringify(products)
  );

}


/* ADD PRODUCT */

function addProduct(){

  const name=document.getElementById("name").value.trim();
  const category=document.getElementById("category").value;
  const price=Number(document.getElementById("price").value);
  const oldPrice=Number(document.getElementById("oldPrice").value);
  const image=document.getElementById("image").value.trim();
  const description=document.getElementById("description").value.trim();

  if(!name || !price){

    alert("Product name aur price bharo.");

    return;
  }

  products.push({

    id:Date.now(),

    name:name,

    category:category,

    price:price,

    oldPrice:oldPrice || price,

    image:image || "https://via.placeholder.com/600x700?text=DADY+CLOTHES",

    description:description || "Premium quality product."

  });

  saveProducts();

  renderProducts();

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("oldPrice").value="";
  document.getElementById("image").value="";
  document.getElementById("description").value="";

  alert("Product added successfully 🎉");

}


/* SHOW PRODUCTS */

function renderProducts(){

  document.getElementById("totalProducts").textContent=
    products.length;

  const box=document.getElementById("products");

  if(products.length===0){

    box.innerHTML="<p>No products.</p>";

    return;
  }

  box.innerHTML=products.map(p=>`

    <div class="product">

      <img src="${p.image}" alt="${p.name}">

      <div>

        <small>${p.category}</small>

        <h3>${p.name}</h3>

        <p class="price">
          ₹${p.price}
          <del>₹${p.oldPrice}</del>
        </p>

        <p>${p.description}</p>

        <button class="edit"
          onclick="editProduct(${p.id})">
          ✏️ EDIT
        </button>

        <button class="delete"
          onclick="deleteProduct(${p.id})">
          🗑️ DELETE
        </button>

      </div>

    </div>

  `).join("");

}


/* EDIT PRODUCT */

function editProduct(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  editId=id;

  document.getElementById("editBox").style.display="block";

  document.getElementById("editName").value=p.name;
  document.getElementById("editCategory").value=p.category;
  document.getElementById("editPrice").value=p.price;
  document.getElementById("editOldPrice").value=p.oldPrice;
  document.getElementById("editImage").value=p.image;
  document.getElementById("editDescription").value=p.description;

  window.scrollTo({
    top:document.getElementById("editBox").offsetTop,
    behavior:"smooth"
  });

}


/* SAVE EDIT */

function saveEdit(){

  const p=products.find(x=>x.id===editId);

  if(!p)return;

  p.name=document.getElementById("editName").value.trim();
  p.category=document.getElementById("editCategory").value;
  p.price=Number(document.getElementById("editPrice").value);
  p.oldPrice=Number(document.getElementById("editOldPrice").value);
  p.image=document.getElementById("editImage").value.trim();
  p.description=document.getElementById("editDescription").value.trim();

  if(!p.name || !p.price){

    alert("Name aur price required hai.");

    return;
  }

  saveProducts();

  renderProducts();

  cancelEdit();

  alert("Product updated successfully ✅");

}


/* CANCEL EDIT */

function cancelEdit(){

  editId=null;

  document.getElementById("editBox").style.display="none";

}


/* DELETE */

function deleteProduct(id){

  if(!confirm("Product delete karna hai?"))return;

  products=products.filter(p=>p.id!==id);

  saveProducts();

  renderProducts();

}


/* ORDERS */

function loadOrders(){

  const orders=JSON.parse(
    localStorage.getItem("dady_orders") || "[]"
  );

  document.getElementById("totalOrders").textContent=
    orders.length;

  const box=document.getElementById("orders");

  if(orders.length===0){

    box.innerHTML="<p>No orders yet.</p>";

    return;
  }

  box.innerHTML=orders.map(o=>`

    <div style="
      border:1px solid #ddd;
      padding:15px;
      margin:10px 0;
      border-radius:10px">

      <b>Order ID: ${o.orderId}</b>

      <p>
        Customer: ${o.name}<br>
        Phone: ${o.phone}<br>
        Address: ${o.address}<br>
        Pincode: ${o.pin}
      </p>

      <b>Total: ₹${o.total}</b>

    </div>

  `).join("");

}

</script>

</body>
    </html>
